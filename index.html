<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soi's message board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Special+Elite&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --paper:      #E9F3FA;
    --paper-dark: #D7EAF5;
    --ink:        #4B3B1E;
    --sepia:      #D9A62E;
    --ribbon:     #5B93B5;
    --stamp:      #E3A73E;
    --card:       #FFFDF6;
    --shadow: 0 10px 30px rgba(75,59,30,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(217,166,46,0.12), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(91,147,181,0.12), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    min-height:100vh;
    display:none;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }
  .screen.active{display:flex;}
  .eyebrow{
    font-family:'Special Elite', monospace;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--sepia);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px,6vw,44px);
    margin:0 0 6px;
    line-height:1.05;
    text-align:justify;
    text-align-last:center;
  }
  .sub{
    font-family:'Inter',sans-serif;
    color:#5b5347;
    font-size:15px;
    max-width:420px;
    text-align:center;
    margin:0 0 28px;
  }

  /* GATE SCREEN */
  .postcard{
    background:var(--card);
    border-radius:2px;
    box-shadow:var(--shadow);
    width:100%;
    max-width:420px;
    padding:34px 30px 28px;
    position:relative;
    border:1px solid rgba(43,38,32,0.08);
  }
  .postcard::before{
    content:"";
    position:absolute; top:14px; right:14px;
    width:52px; height:52px;
    border:2px dashed var(--stamp);
    border-radius:3px;
    opacity:.55;
  }
  .postcard::after{
    content:"♥";
    position:absolute; top:28px; right:33px;
    color:var(--stamp);
    opacity:.6;
    font-size:22px;
  }
  label{
    display:block;
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--sepia);
    margin:16px 0 6px;
  }
  label:first-of-type{margin-top:0;}
  input, textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border:1px solid #d8cfba;
    border-radius:4px;
    background:#fffdf8;
    color:var(--ink);
    outline:none;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:4px;
    padding:12px 20px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    width:100%;
    margin-top:22px;
  }
  .qr-toggle{
    display:block;
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:var(--sepia);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
  }
  .qr-box{
    display:none;
    margin-top:18px;
    text-align:center;
    border-top:1px dashed #d8cfba;
    padding-top:18px;
  }
  .qr-box.show{display:block;}
  #qrcode{display:inline-block; padding:10px; background:#fff; border-radius:4px; box-shadow:var(--shadow);}
  .qr-hint{font-size:12px; color:#8a8172; margin-top:8px;}

  /* GALLERY SCREEN */
  .gallery-header{text-align:center; margin-bottom:34px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:26px;
    width:100%;
    max-width:820px;
  }
  .polaroid{
    background:var(--card);
    padding:10px 10px 34px;
    border-radius:2px;
    box-shadow:var(--shadow);
    cursor:pointer;
    position:relative;
  }
  .photo{
    width:100%;
    aspect-ratio:1/1;
    border-radius:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
  }
  .photo-caption{
    font-family:'Special Elite', monospace;
    font-size:13px;
    text-align:center;
    margin-top:10px;
    color:var(--ink);
  }
  .pin{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e7746b, var(--stamp));
  }

  .divider{
    width:100%;
    max-width:820px;
    display:flex;
    align-items:center;
    gap:14px;
    margin:40px 0 22px;
    color:var(--sepia);
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--sepia), transparent);
    opacity:.5;
  }
  .favorite-card{
    width:100%;
    max-width:820px;
    background:linear-gradient(120deg, #FFF7DC, #FCE49A);
    border:2px solid var(--sepia);
    border-radius:18px;
    padding:22px 26px;
    display:flex;
    align-items:center;
    gap:20px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .favorite-card .fav-icon{
    font-size:46px;
    flex-shrink:0;
    width:76px; height:76px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.55);
    border-radius:50%;
    border:2px solid rgba(217,166,46,0.5);
  }
  .favorite-card .fav-text h3{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    color:var(--ink);
  }

  /* GAME SCREEN */
  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(85px, 1fr));
    gap:10px;
    width:100%;
  }
  .game-card{
    aspect-ratio:1/1;
    perspective:700px;
    cursor:pointer;
  }
  .game-card-inner{
    position:relative;
    width:100%; height:100%;
    transition:transform .4s ease;
    transform-style:preserve-3d;
  }
  .game-card.flipped .game-card-inner{transform:rotateY(180deg);}
  .game-card-face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    backface-visibility:hidden;
    font-size:26px;
    overflow:hidden;
  }
  .game-card-front{
    background:linear-gradient(135deg,#EAF3FB,#F5DE8A);
    border:2px solid var(--sepia);
    color:var(--sepia);
  }
  .game-card-back{
    background:var(--card);
    border:2px solid var(--ribbon);
    transform:rotateY(180deg);
  }
  .game-card-back img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .game-card-back .game-card-name{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(43,38,32,0.6); color:#fdfaf2;
    font-family:'Special Elite', monospace; font-size:9px;
    text-align:center; padding:3px 2px;
  }
  .game-win{text-align:center; margin-top:24px;}

  /* BOARD SCREEN & UPLOAD */
  .board-wrap{width:100%; max-width:560px;}
  .board-top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px;}
  .back-btn{
    font-family:'Special Elite', monospace;
    background:none; border:none; cursor:pointer;
    color:var(--sepia); font-size:13px;
  }
  .music-btn{
    font-family:'Inter',sans-serif;
    font-size:13px; background:var(--card);
    border:1px solid var(--sepia); color:var(--sepia);
    border-radius:20px; padding:8px 16px; cursor:pointer;
    position:fixed; top:16px; right:16px; z-index:100;
  }
  .music-panel{
    position:fixed; top:60px; right:16px; z-index:100;
    background:var(--card); border-radius:10px;
    box-shadow:var(--shadow); padding:8px; width:190px;
    display:none; flex-direction:column; gap:2px;
  }
  .music-panel.open{display:flex;}
  .music-track, .music-none{
    background:none; border:none; text-align:left;
    font-family:'Inter',sans-serif; font-size:13.5px;
    color:var(--ink); padding:9px 10px; border-radius:6px; cursor:pointer;
  }
  .board-title{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin:0;}
  .entries{display:flex; flex-direction:column; gap:14px;}
  .entry{
    background:var(--card); border-radius:2px; padding:16px 18px;
    box-shadow:0 4px 12px rgba(43,38,32,0.1);
  }
  .entry-msg{font-size:15px; line-height:1.6; color:var(--ink); font-family:'Fraunces', serif; font-style:italic;}

  .upload-box{
    background:var(--card);
    border-radius:8px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
    border:1px dashed var(--sepia);
  }
  .fav-preset-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  @media (max-width:420px){ .fav-preset-grid{ grid-template-columns:1fr; } }
  .fav-preset-item{
    background:var(--card); border-radius:8px; overflow:hidden;
    box-shadow:0 4px 12px rgba(43,38,32,0.12); position:relative;
  }
  .fav-preset-item img{width:100%; display:block;}
  .fav-preset-caption{
    padding:9px 12px 11px; font-size:13px; line-height:1.4;
    color:var(--ink); font-family:'Fraunces', serif; font-style:italic;
  }
</style>
</head>
<body>

<button class="music-btn" id="music-btn"><span id="music-label">Choose music</span></button>
<div class="music-panel" id="music-panel">
  <button class="music-none" id="music-none-btn">No music</button>
</div>

<!-- GATE SCREEN -->
<section id="gate-screen" class="screen active">
  <div class="eyebrow">Please sign in</div>
  <h1>Soi's message board</h1>
  <p class="sub">random messages by soi hehe</p>

  <div class="postcard">
    <label for="g-name">Your name *</label>
    <input id="g-name" type="text" placeholder="Your name" autocomplete="name">
    <button class="btn btn-primary" id="enter-btn">Enter the Album</button>

    <button class="qr-toggle" id="qr-toggle">Show QR code to share this page</button>
    <div class="qr-box" id="qr-box">
      <div id="qrcode"></div>
      <div class="qr-hint">Scans straight to this page.</div>
    </div>
  </div>
</section>

<!-- GALLERY SCREEN -->
<section id="gallery-screen" class="screen">
  <div class="gallery-header">
    <div class="eyebrow" id="greeting"></div>
    <h1 id="gallery-title">Pick what fits<br>right now</h1>
  </div>
  <div class="grid" id="gallery-grid"></div>

  <div class="divider">✦ More Here ✦</div>
  <div class="favorite-card" id="favorites-card" tabindex="0" role="button">
    <div class="fav-icon">📸</div>
    <div class="fav-text">
      <h3>Favorite Photos</h3>
    </div>
  </div>
  <div class="favorite-card" id="game-card" tabindex="0" role="button" style="margin-top:16px;">
    <div class="fav-icon">🧩</div>
    <div class="fav-text">
      <h3>Memory Game</h3>
    </div>
  </div>
</section>

<!-- MESSAGE BOARD & LIVE PHOTO SCREEN -->
<section id="board-screen" class="screen">
  <div class="board-wrap">
    <div class="board-top">
      <button class="back-btn" id="back-btn">&larr; back to album</button>
    </div>
    <h2 class="board-title" id="board-title"></h2>
    <p class="sub" id="board-subtitle" style="text-align:left; margin-top:4px; margin-bottom:24px;"></p>

    <!-- UPLOAD BOX (VISIBLE ON FAVORITES BOARD ONLY) -->
    <div class="upload-box" id="upload-box" style="display:none;">
      <label>Upload a Photo</label>
      <input type="file" id="file-input" accept="image/*" style="margin-bottom:10px;">
      <textarea id="file-caption" placeholder="Add a caption..." rows="2"></textarea>
      <button class="btn btn-primary" id="upload-btn" style="margin-top:10px;">Post Photo for Everyone</button>
      <div id="upload-status" style="font-size:12px; margin-top:8px; color:var(--sepia);"></div>
    </div>

    <div id="entries" class="entries"></div>
  </div>
</section>

<audio id="board-audio" loop></audio>

<!-- MEMORY GAME SCREEN -->
<section id="game-screen" class="screen">
  <div class="board-wrap">
    <div class="board-top">
      <button class="back-btn" id="game-back-btn">&larr; back to album</button>
    </div>
    <h2 class="board-title">Memory Game</h2>
    <p class="sub" style="text-align:left; margin-top:4px; margin-bottom:20px;">Flip two at a time and find the matching pairs.</p>

    <div class="game-grid" id="game-grid"></div>

    <div id="game-win" class="game-win" style="display:none;">
      <p>You matched them all! 🎉</p>
      <button class="btn btn-primary" id="game-replay-btn" style="width:auto; padding:12px 24px;">Play again</button>
    </div>
  </div>
</section>

<script>

  { id:'anxious', label:"Are you anxious?", emoji:'🤞', c1:'#E8E1EE', c2:'#C3B3D6', messages:["It's hard being an anxious person like me . I often worry about many things that I have no apparent control over, and it is really hard to avoid feeling that way. The truth is, having anxiety is a normal thing that we humans experience, sometimes we have a lot of worried thoughts and a fast heartbeat too. But remember that at the end of the day, everything is going to be okay :)). Overthinking happens because we are scared of what we don 't know, but trusting yourself is the answer to keep going regardless of the obstacles.", "No matter how scared you are , do it scared, do it while you're nervous, and do it even if you think you can't. Remember the times when you felt the same way, and now look how much you've grown!! So whenever you feel like you don't have enough courage to face something, imagine how much the future you is going to be happy. Of course , never forget that I'm also here, I 'm an anxious person too , but if you need something, I am surely just one call away!! So don't be scared, kasi there are a lot of people who love you, INCLUDING ME OF COURSE. I lalalalalalalove youuuu."] },

const $ = (sel) => document.querySelector(sel);
let currentUserName = "Anonymous";

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* MUSIC CONTROL */
const MUSIC_TRACKS = [
  { id:'sad', label:'Those Eyes — New West', src:'audio/sad.mp3' },
  { id:'stressed', label:'Fade Into You — Mazzy Star', src:'audio/stressed.mp3' },
  { id:'anxious', label:'Mrs. Magic — Strawberry Guy', src:'audio/anxious.mp3' },
  { id:'mad', label:'stupid song — Olivia Rodrigo', src:'audio/mad.mp3' },
  { id:'confused', label:'Who Knows — Daniel Caesar', src:'audio/confused.mp3' },
  { id:'happy', label:'Pretty Boy — The Neighbourhood', src:'audio/happy.mp3' },
];

const audioEl = $('#board-audio');
const musicBtn = $('#music-btn');
const musicLabel = $('#music-label');
const musicPanel = $('#music-panel');
let currentTrackId = null;

MUSIC_TRACKS.forEach(track => {
  const row = document.createElement('button');
  row.className = 'music-track';
  row.textContent = track.label;
  row.addEventListener('click', () => {
    if(currentTrackId === track.id){
      audioEl.pause();
      currentTrackId = null;
      musicLabel.textContent = 'Choose music';
    } else {
      audioEl.src = track.src;
      audioEl.play().catch(() => {});
      currentTrackId = track.id;
      musicLabel.textContent = track.label;
    }
    musicPanel.classList.remove('open');
  });
  musicPanel.appendChild(row);
});

$('#music-none-btn').addEventListener('click', () => {
  audioEl.pause();
  currentTrackId = null;
  musicLabel.textContent = 'Choose music';
  musicPanel.classList.remove('open');
});

musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  musicPanel.classList.toggle('open');
});

/* GATE */
$('#enter-btn').addEventListener('click', () => {
  const name = $('#g-name').value.trim();
  if(!name) return;
  currentUserName = name;
  $('#greeting').textContent = `Signed in as ${name}`;
  $('#gallery-title').textContent = `Hellooo my honeybunchh`;
  renderGallery();
  showScreen('#gallery-screen');
});

let qrRendered = false;
$('#qr-toggle').addEventListener('click', () => {
  const box = $('#qr-box');
  box.classList.toggle('show');
  if(box.classList.contains('show') && !qrRendered){
    new QRCode(document.getElementById('qrcode'), { text: window.location.href, width: 140, height: 140 });
    qrRendered = true;
  }
});

/* GALLERY */
function renderGallery(){
  const grid = $('#gallery-grid');
  grid.innerHTML = '';
  SECTIONS.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.innerHTML = `
      <div class="pin"></div>
      <div class="photo" style="background:linear-gradient(135deg, ${sec.c1}, ${sec.c2});">${sec.emoji}</div>
      <div class="photo-caption">${sec.label}</div>
    `;
    card.addEventListener('click', () => openBoard(sec));
    grid.appendChild(card);
  });
}

$('#favorites-card').addEventListener('click', () => openBoard({ id:'favorites', label:"Favorite Photos" }));
$('#game-card').addEventListener('click', () => { showScreen('#game-screen'); buildGame(); });

/* BOARD */
function openBoard(sec){
  $('#board-title').textContent = sec.label;
  const wrap = $('#entries');
  wrap.innerHTML = '';

  if(sec.id === 'favorites'){
    $('#board-subtitle').textContent = "Upload and share your favorite photos!";
    $('#upload-box').style.display = 'block';

    const presetGrid = document.createElement('div');
    presetGrid.className = 'fav-preset-grid';
    presetGrid.id = 'live-photos-grid';
    wrap.appendChild(presetGrid);

    // 1. Render Pre-loaded Favorites
    PRESET_FAVORITES.forEach(item => {
      const div = document.createElement('div');
      div.className = 'fav-preset-item';
      div.innerHTML = `
        <img src="${item.src}" alt="Photo">
        ${item.caption ? `<div class="fav-preset-caption">${item.caption}</div>` : ''}
      `;
      presetGrid.appendChild(div);
    });

    // 2. Render Stored Uploads from LocalStorage
    const stored = JSON.parse(localStorage.getItem('user_uploaded_photos') || '[]');
    stored.forEach(item => {
      const div = document.createElement('div');
      div.className = 'fav-preset-item';
      div.innerHTML = `
        <img src="${item.src}" alt="Uploaded Photo">
        <div class="fav-preset-caption">
          <strong>${item.uploader}:</strong> ${item.caption || ''}
        </div>
      `;
      presetGrid.prepend(div);
    });

  } else {
    $('#upload-box').style.display = 'none';
    $('#board-subtitle').textContent = 'Take your time reading these.';
    sec.messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `<div class="entry-msg">${msg}</div>`;
      wrap.appendChild(div);
    });
  }
  showScreen('#board-screen');
}

/* IMGBB DIRECT UPLOAD HANDLER */
$('#upload-btn').addEventListener('click', async () => {
  const fileInput = $('#file-input');
  const caption = $('#file-caption').value.trim();
  const status = $('#upload-status');

  if (!fileInput.files[0]) {
    status.textContent = 'Please select an image file first.';
    return;
  }

  status.textContent = 'Uploading... Please wait.';

  const formData = new FormData();
  formData.append('image', fileInput.files[0]);

  try {
    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    const result = await response.json();

    if (!result.success) throw new Error('Upload failed');

    const imageUrl = result.data.url;

    const newPhoto = {
      uploader: currentUserName,
      src: imageUrl,
      caption: caption
    };

    let savedPhotos = JSON.parse(localStorage.getItem('user_uploaded_photos') || '[]');
    savedPhotos.unshift(newPhoto);
    localStorage.setItem('user_uploaded_photos', JSON.stringify(savedPhotos));

    const grid = $('#live-photos-grid');
    const div = document.createElement('div');
    div.className = 'fav-preset-item';
    div.innerHTML = `
      <img src="${imageUrl}" alt="Uploaded Photo">
      <div class="fav-preset-caption">
        <strong>${currentUserName}:</strong> ${caption || ''}
      </div>
    `;
    grid.prepend(div);

    status.textContent = 'Uploaded successfully!';
    fileInput.value = '';
    $('#file-caption').value = '';
  } catch (error) {
    console.error(error);
    status.textContent = 'Upload failed. Check your API key.';
  }
});

/* MEMORY GAME */
const GAME_IMAGES = [
  { name:'Akim', src:'game/Akim.jpg' }, { name:'Chippy', src:'game/chippy.jpg' },
  { name:'Good Mingming', src:'game/good_mingming.jpg' }, { name:'Handsome Cat', src:'game/handsome_cat.jpg' },
  { name:'Lagi', src:'game/lagi.jpg' }, { name:'Louie', src:'game/Louie.jpg' },
  { name:'Maki', src:'game/Maki.jpg' }, { name:'Manga and Spidey', src:'game/manga_and_spidey.jpg' },
  { name:'Mister Ipis', src:'game/Mister_ipis.jpg' }, { name:'Niamh', src:'game/Niamh.jpg' },
  { name:'Sol and Chippy', src:'game/solandchippy.jpg' }, { name:'Catpit Bahay', src:'game/Catpit_Bahay.jpg' }
];

let gameCards = [];
let flippedIndices = [];
let matchedCount = 0;
let gameLocked = false;

function buildGame(){
  const pairs = [...GAME_IMAGES, ...GAME_IMAGES].sort(() => Math.random() - 0.5);
  gameCards = pairs.map((img, i) => ({ id:i, name:img.name, src:img.src, flipped:false, matched:false }));
  flippedIndices = []; matchedCount = 0; gameLocked = false;
  $('#game-win').style.display = 'none';
  renderGame();
}

function renderGame(){
  const grid = $('#game-grid');
  grid.innerHTML = '';
  gameCards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'game-card' + (card.flipped || card.matched ? ' flipped' : '');
    el.innerHTML = `
      <div class="game-card-inner">
        <div class="game-card-face game-card-front">✦</div>
        <div class="game-card-face game-card-back">
          <img src="${card.src}" alt="">
          <span class="game-card-name">${card.name}</span>
        </div>
      </div>
    `;
    el.addEventListener('click', () => {
      if(gameLocked || card.flipped || card.matched) return;
      card.flipped = true;
      flippedIndices.push(idx);
      renderGame();

      if(flippedIndices.length === 2){
        gameLocked = true;
        const [i1, i2] = flippedIndices;
        if(gameCards[i1].src === gameCards[i2].src){
          gameCards[i1].matched = true; gameCards[i2].matched = true;
          matchedCount++; flippedIndices = []; gameLocked = false;
          if(matchedCount === GAME_IMAGES.length) $('#game-win').style.display = 'block';
        } else {
          setTimeout(() => {
            gameCards[i1].flipped = false; gameCards[i2].flipped = false;
            flippedIndices = []; gameLocked = false;
            renderGame();
          }, 800);
        }
      }
    });
    grid.appendChild(el);
  });
}

$('#game-replay-btn').addEventListener('click', buildGame);
